version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Bahia
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /images/base
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Bahia
    open-pull-requests-limit: 2
