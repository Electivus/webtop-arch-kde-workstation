name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WORKSTATION_TEST_IMAGE: electivus/webtop-arch-kde-base:ci
      WORKSTATION_SALESFORCE_TEST_IMAGE: electivus/webtop-arch-kde-salesforce:ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Make room for desktop images and prepared applications
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          df -h /
          # These preinstalled SDKs are unused by this disposable desktop runner.
          # Keep Docker images and volumes; the acceptance tests own cleanup.
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          df -h /
          # Recovery holds the original home, its archive and a new volume together.
          available_kib=$(df --output=avail -k / | tail -n 1)
          if [ "$available_kib" -lt 33554432 ]; then
            echo 'Desktop acceptance needs at least 32 GiB free before building images.' >&2
            exit 1
          fi
      - name: Check Bash
        run: shellcheck images/base/root/custom-cont-init.d/*.sh images/base/root/usr/local/bin/workstation-healthcheck images/base/root/usr/local/bin/google-chrome images/base/root/usr/local/bin/workstation-pacman images/base/root/etc/electivus/examples/compose-demo/write-result.sh images/salesforce/root/usr/local/bin/*
      - name: Build and export native commands
        run: docker build --file images/base/Dockerfile --target commands-export --output type=local,dest=.local/cli .
      - name: Build desktop image
        run: docker build --file images/base/Dockerfile --build-arg VERSION=ci --build-arg REVISION="$GITHUB_SHA" --tag "$WORKSTATION_TEST_IMAGE" .
      - name: Build Salesforce from the matching base
        run: docker build --file images/salesforce/Dockerfile --build-arg BASE_IMAGE="$WORKSTATION_TEST_IMAGE" --build-arg VERSION=ci --build-arg REVISION="$GITHUB_SHA" --tag "$WORKSTATION_SALESFORCE_TEST_IMAGE" .
      - name: Exercise public lifecycle commands
        run: python3 tests/test_commands.py
      - name: Exercise browser preparation and terminal
        run: python3 tests/test_preparation.py
      - name: Exercise persistent projects and host exchange
        run: python3 tests/test_projects.py
      - name: Exercise Docker and Compose with a Linux project
        run: python3 tests/test_docker_projects.py
      - name: Exercise both editors, Salesforce services and interrupted preparation
        run: python3 tests/test_salesforce.py
      - name: Exercise optional proxy, CA trust, removal and preparation recovery
        run: python3 tests/test_network.py
      - name: Exercise editor and Salesforce connections through the configured proxy
        run: python3 tests/test_network_apps.py
      - name: Exercise personal backup, recovery, retention and failures
        run: python3 tests/test_backups.py
      - name: Exercise extra package inventory, rebuilds, recovery and failures
        run: |
          python3 tests/test_packages.py
          WORKSTATION_TEST_IMAGE="$WORKSTATION_SALESFORCE_TEST_IMAGE" python3 tests/test_packages.py PackageAcceptance.test_inventory_distinguishes_image_components
