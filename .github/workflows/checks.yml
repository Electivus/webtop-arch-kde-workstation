name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check Bash
        run: shellcheck images/base/root/custom-cont-init.d/*.sh images/base/root/usr/local/bin/workstation-healthcheck
      - name: Build and export native commands
        run: docker build --file images/base/Dockerfile --target commands-export --output type=local,dest=.local/cli .
      - name: Build desktop image
        run: docker build --file images/base/Dockerfile --build-arg VERSION=ci --build-arg REVISION="$GITHUB_SHA" --tag electivus/webtop-arch-kde-base:t01 .
      - name: Exercise public lifecycle commands
        run: python3 tests/test_commands.py
