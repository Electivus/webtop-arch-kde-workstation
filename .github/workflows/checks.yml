name: Checks
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: 'Coordinated fixed tag; blank generates a dated candidate version'
        type: string
        required: false
      prove_test_failure:
        description: 'Run the deliberate failed-test proof; this run cannot approve a candidate'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # Only superseded PR checks may be cancelled. Every scheduled, manual and
  # main-push candidate keeps its own run and complete diagnostic artifacts.
  group: checks-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  desktop-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Make room for desktop images and prepared applications
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          df -h /
          # Compilers and application runtimes are built inside Docker. Keep the
          # system Python and the tool-cache directory, but remove unused SDKs.
          test -x /usr/bin/python3
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /usr/share/swift /usr/local/.ghcup \
            /usr/lib/jvm /usr/lib/llvm-* /usr/lib/google-cloud-sdk /opt/az \
            /opt/google /opt/microsoft /usr/local/share/powershell /usr/local/lib/node_modules \
            /usr/share/miniconda /usr/local/julia* /opt/pipx /usr/local/aws-cli \
            /usr/local/aws-sam-cli /usr/share/az_*
          sudo find /opt/hostedtoolcache -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          # These are unused images of the disposable runner's original daemon;
          # the isolated candidate engine is installed only in the next step.
          docker image prune --all --force
          docker builder prune --all --force
          python3 --version
          command -v shellcheck
          df -h /
          available_kib=$(df --output=avail -k / | tail -n 1)
          if [ "$available_kib" -lt 54525952 ]; then
            echo 'Candidate archives and desktop recovery need at least 52 GiB free before building images.' >&2
            sudo du -xhd1 /usr/local /usr/share /usr/lib /opt /var/lib | sort -h
            exit 1
          fi
      - name: Use a Docker image store that preserves OCI indexes
        id: docker
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5
        with:
          version: v29.7.2
          daemon-config: |
            {"features": {"containerd-snapshotter": true}}
      - name: Connect the workstation socket to the selected CI engine
        env:
          SELECTED_DOCKER_SOCKET: ${{ steps.docker.outputs.sock }}
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          case "$SELECTED_DOCKER_SOCKET" in
            unix:///*) ;;
            *) echo 'The workstation requires the selected local Unix socket.' >&2; exit 1 ;;
          esac
          selected_socket="${SELECTED_DOCKER_SOCKET#unix://}"
          test -S "$selected_socket"
          # The action uses its own socket; Docker Desktop exposes this standard path.
          # Stop only the disposable runner's original daemon before linking the two.
          sudo systemctl stop docker.service docker.socket
          sudo ln -sfn -- "$selected_socket" /var/run/docker.sock
          selected_engine=$(docker info --format '{{.ID}}')
          workstation_engine=$(docker --host unix:///var/run/docker.sock info --format '{{.ID}}')
          test "$workstation_engine" = "$selected_engine"
      - name: Set up the pinned build client
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4
        with:
          version: v0.36.1
          driver: docker
      - name: Check Bash
        run: shellcheck images/base/root/custom-cont-init.d/*.sh images/base/root/usr/local/bin/workstation-healthcheck images/base/root/usr/local/bin/google-chrome images/base/root/usr/local/bin/workstation-pacman images/base/root/etc/electivus/examples/compose-demo/write-result.sh images/salesforce/root/usr/local/bin/*
      - name: Exercise the acceptance contract and candidate transport
        run: |
          python3 tests/test_acceptance_contract.py
          python3 tests/test_candidates.py
          python3 tests/test_publication.py
      - name: Select the coordinated candidate version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import datetime, os, re
          version = os.environ.get('REQUESTED_VERSION') or (datetime.datetime.now(datetime.timezone.utc).strftime('%Y.%m.%d') + '-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          if not re.fullmatch(r'[0-9][A-Za-z0-9_.-]{0,127}', version):
              raise SystemExit('Use a numeric version prefix covered by the Docker Hub immutable tag policy')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('CANDIDATE_VERSION=' + version + '\n')
          PY
      - name: Build and identify the exact candidate pair
        id: candidate
        run: python3 scripts/candidate.py build --directory .local/candidate --version "$CANDIDATE_VERSION" --revision "$GITHUB_SHA"
      - name: Release build-only cache before full recovery acceptance
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          docker builder prune --all --force
          docker system df
          df -h /
          available_kib=$(df --output=avail -k / | tail -n 1)
          if [ "$available_kib" -lt 25165824 ]; then
            echo 'Prepared applications, backup and recovery need at least 24 GiB free after building candidates.' >&2
            exit 1
          fi
      - name: Run the common acceptance contract against those artifacts
        env:
          PROVE_TEST_FAILURE: ${{ inputs.prove_test_failure }}
        run: |
          args=()
          if [ "$PROVE_TEST_FAILURE" = true ]; then
            args+=(--prove-test-failure)
          fi
          python3 scripts/candidate.py test --directory .local/candidate "${args[@]}"
      - name: Retain the candidate identity, commands and validation diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: candidate-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/candidate/*.json
            .local/candidate/*.log
            .local/candidate/commands.tar
            .local/candidate/validation/
          retention-days: 7
          compression-level: 0
          if-no-files-found: warn
      - name: Retain the base archive
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: webtop-arch-kde-base-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/candidate/webtop-arch-kde-base.oci.tar
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: Retain the Salesforce archive
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: webtop-arch-kde-salesforce-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/candidate/webtop-arch-kde-salesforce.oci.tar
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
